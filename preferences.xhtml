<groupbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  class="zns-section"
  onload="ZoteroNotesSyncPreferences.init(document)">
  <html:style>
    .zns-section {
      max-width: 680px;
    }

    .zns-row {
      display: grid;
      gap: 6px;
      margin-bottom: 16px;
    }

    .zns-inline {
      display: flex;
      gap: 8px;
    }

    .zns-output-dir {
      flex: 1;
      min-width: 0;
    }
  </html:style>

  <label><html:h2>Zotero Notes Sync</html:h2></label>

  <vbox class="zns-row">
    <label control="zns-output-dir">Markdown output folder</label>
    <html:div class="zns-inline">
      <html:input id="zns-output-dir" class="zns-output-dir" type="text" />
      <html:button id="zns-browse" type="button">Choose...</html:button>
    </html:div>
  </vbox>

  <vbox class="zns-row">
    <html:label>
      <html:input id="zns-write-index" type="checkbox" />
      Write _index.md
    </html:label>
    <html:label>
      <html:input id="zns-standalone" type="checkbox" />
      Include standalone notes
    </html:label>
  </vbox>
</groupbox>
